 <div class="form-field {% if form_field.errors %}errors{% endif %}">   
    <div class="label-field">
    <label for="{{ form_field.id_for_label }}">
        {{ form_field.label | upper }}
        {% if form_field.field.required %}<span class="required">*</span>{% endif %}
    </label>
    </div>
    <div class="input-field">
        {{ form_field }}
    </div>
    <div class="error-field">
        {{ form_field.errors }}
    </div>
</div>
