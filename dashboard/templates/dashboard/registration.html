{% extends "base.html" %}
{% load static %}

{% block title %}
Tenant Registration
{% endblock title %}

{% block css_file %}
    <link rel="stylesheet" href="{% static 'dashboard/registration.css' %}">
{% endblock css_file %}


{% block content %}
<main>
    <header class="page-header">
        <div class="header-title header-box">
            <h2>Register Tenant</h2>
        </div>
        <div class="header-date header-box">
            <span>{% now "M Y" %}</span>
            <span class="status-dot"></span>
        </div>
    </header>

    <form action="" method="POST">
        {% csrf_token %}
        {{ tenant_form }}
        {{ address_form }}
        {{ room_form }}
        <button type="submit">Register Tenant</button>
    </form>

</main>
{% endblock content %}
